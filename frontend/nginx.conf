# nginx-Konfiguration für DHubBW Frontend (Web-Prod-Bundle).
# HTTPS-Version: HTTP→HTTPS Redirect + TLS-Termination + Swagger-Proxy.

# HTTP: Redirect auf HTTPS
server {
    listen 80;
    server_name vm553.ipp-vps.net;

    # ACME-Challenge für Let's Encrypt Renewal (webroot-Modus, Zero-Downtime)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name vm553.ipp-vps.net;

    ssl_certificate     /etc/letsencrypt/live/vm553.ipp-vps.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vm553.ipp-vps.net/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=2592000" always;

    root /usr/share/nginx/html;
    index index.html;

    # Lange Cache-Lifetime für versionierte Build-Assets (Hash im Dateinamen).
    # `/assets/` = expo-router-Assets (Image-Registry), `/_expo/static/` = die
    # gebündelten JS/CSS-Hash-Files (kommen aus `expo export --platform web`).
    location ~ ^/(assets|_expo/static)/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Swagger UI – Proxy zum Backend (Port 8080 ist nicht öffentlich erreichbar).
    # springdoc-Pfade: /swagger-ui.html (Redirect-Einstieg), /swagger-ui/ (UI),
    # /v3/api-docs (OpenAPI-JSON). Kein Rewrite nötig – Pfade 1:1 auf Backend.
    location = /swagger-ui.html {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream "backend:8080";
        proxy_pass http://$api_upstream/swagger-ui.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream "backend:8080";
        proxy_pass http://$api_upstream/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/v3/api-docs {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream "backend:8080";
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API-Reverse-Proxy → Spring-Boot-Backend (im selben Compose-Netz: backend:8080).
    # Docker's eingebauter Resolver (127.0.0.11) + Variable für proxy_pass
    # → Host-Auflösung passiert zur Request-Zeit, nicht beim nginx-Start.
    # rewrite strippt das /api/-Präfix, sodass Backend `/student/...` etc. sieht.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream "backend:8080";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-Fallback: expo-router rendert per Route eine eigene `<route>.html`.
    # Wir versuchen erst exakte Datei (`/login.html`), dann mit `.html`-Extension
    # (`/login` → `/login.html`), dann index.html (Root-Redirect → Dashboard),
    # zuletzt die Not-Found-Seite. Damit funktionieren Direct-Navigation und
    # Reload auf jeder Sub-Route.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html /+not-found.html =404;
    }
}
