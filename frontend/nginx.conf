# nginx-Konfiguration für DHubBW Frontend (Web-Prod-Bundle).
# Wird in das Image kopiert (siehe Dockerfile, nginx-Stage).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Lange Cache-Lifetime für versionierte Build-Assets (Hash im Dateinamen).
    # `/assets/` = expo-router-Assets (Image-Registry), `/_expo/static/` = die
    # gebündelten JS/CSS-Hash-Files (kommen aus `expo export --platform web`).
    location ~ ^/(assets|_expo/static)/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API-Reverse-Proxy → Spring-Boot-Backend (im selben Compose-Netz: backend:8080).
    # Docker's eingebauter Resolver (127.0.0.11) + Variable für proxy_pass
    # → Host-Auflösung passiert zur Request-Zeit, nicht beim nginx-Start.
    # Sonst würde der Container beim Boot abstürzen, wenn das Backend (noch)
    # nicht läuft (compose-Race / Smoke-Test ohne Backend).
    # rewrite strippt das /api/-Präfix, sodass Backend `/student/...` etc. sieht.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream "backend:8080";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-Fallback: expo-router rendert per Route eine eigene `<route>.html`.
    # Wir versuchen erst exakte Datei (`/login.html`), dann mit `.html`-Extension
    # (`/login` → `/login.html`), dann index.html (Root-Redirect → Dashboard),
    # zuletzt die Not-Found-Seite. Damit funktionieren Direct-Navigation und
    # Reload auf jeder Sub-Route.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html /+not-found.html =404;
    }
}
