stages:
  - build
  - test
  - deploy

default:
  tags: [vm553]

variables:
  BACKEND_IMAGE: dhubbw-backend:latest
  FRONTEND_IMAGE: dhubbw-frontend:latest
  GIT_CLEAN_FLAGS: -ffdx -e backend/target/

.fix-backend-ownership:
  after_script:
    - docker run --rm -v "$PWD/backend/target:/target" eclipse-temurin:25-jdk chown -R $(id -u):$(id -g) /target 2>/dev/null || true

# ─── Build ───────────────────────────────────────────────────────────────────

pipeline-check:
  stage: build
  script:
    - echo "Pipeline läuft."
  rules:
    - if: $CI_COMMIT_BRANCH != "main"

build-backend:
  extends: .fix-backend-ownership
  stage: build
  script:
    - docker run --rm -v "$PWD/backend:/app" -v "$HOME/.m2:/root/.m2" -w /app eclipse-temurin:25-jdk ./mvnw clean package -DskipTests
    - docker build -f backend/docker/Dockerfile -t $BACKEND_IMAGE backend/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/**/*

build-frontend:
  stage: build
  script:
    - docker build -t $FRONTEND_IMAGE frontend/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - frontend/**/*

# ─── Test ────────────────────────────────────────────────────────────────────

test-backend:
  extends: .fix-backend-ownership
  stage: test
  script:
    - docker run --rm -v "$PWD/backend:/app" -v "$HOME/.m2:/root/.m2" -w /app eclipse-temurin:25-jdk ./mvnw clean verify
  artifacts:
    paths:
      - backend/target/site/jacoco/
      - backend/target/openapi.json
    expire_in: 1 week
  coverage: '/Total.*?([0-9]{1,3})%/'
  rules:
    - changes:
        - backend/**/*

# ─── Deploy ──────────────────────────────────────────────────────────────────

deploy:
  stage: deploy
  needs:
    - job: build-backend
      optional: true
    - job: build-frontend
      optional: true
    - job: test-backend
      optional: true
  script:
    - docker rm -f postgres backend frontend 2>/dev/null || true
    - docker rm -f $(docker ps -q --filter "publish=8080") 2>/dev/null || true
    - docker rm -f $(docker ps -q --filter "publish=80") 2>/dev/null || true
    - docker compose --env-file /opt/projects/devstack/.env -f deploy/docker-compose.yml up -d --remove-orphans
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/**/*
        - frontend/**/*
        - deploy/**/*
