stages:
  - build
  - test
  - deploy

default:
  tags: [vm553]

variables:
  BACKEND_IMAGE: dhubbw-backend:latest
  FRONTEND_IMAGE: dhubbw-frontend:latest
  GIT_CLEAN_FLAGS: -ffdx -e backend/target/

.fix-backend-ownership:
  after_script:
    - docker run --rm -v "$PWD/backend/target:/target" eclipse-temurin:25-jdk chown -R $(id -u):$(id -g) /target 2>/dev/null || true

# ─── Build ───────────────────────────────────────────────────────────────────

pipeline-check:
  stage: build
  script:
    - echo "Pipeline läuft."
  rules:
    - if: $CI_COMMIT_BRANCH != "main"

build-backend:
  extends: .fix-backend-ownership
  stage: build
  script:
    - docker run --rm -v "$PWD/backend:/app" -v "$HOME/.m2:/root/.m2" -w /app eclipse-temurin:25-jdk ./mvnw clean package -DskipTests
    - docker build -f backend/docker/Dockerfile -t $BACKEND_IMAGE backend/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/**/*

build-frontend:
  stage: build
  script:
    - docker build -t $FRONTEND_IMAGE frontend/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - frontend/**/*

# ─── Test ────────────────────────────────────────────────────────────────────

test-backend:
  extends: .fix-backend-ownership
  stage: test
  script:
    - docker run --rm -v "$PWD/backend:/app" -v "$HOME/.m2:/root/.m2" -w /app eclipse-temurin:25-jdk ./mvnw clean verify
  artifacts:
    paths:
      - backend/target/site/jacoco/
      - backend/target/openapi.json
    expire_in: 1 week
  coverage: '/Total.*?([0-9]{1,3})%/'
  rules:
    - changes:
        - backend/**/*

validate-migrations:
  stage: test
  variables:
    PG_CONTAINER: migration-pg-$CI_JOB_ID
    NET_NAME: migration-net-$CI_JOB_ID
  script:
    - docker network create $NET_NAME
    - docker run -d --name $PG_CONTAINER --network $NET_NAME
        -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=testdb postgres:17
    - |
      for i in $(seq 1 30); do
        docker exec $PG_CONTAINER pg_isready -U postgres && break
        sleep 2
      done
    - docker run --rm --network $NET_NAME
        -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql"
        flyway/flyway:10
        -url=jdbc:postgresql://$PG_CONTAINER:5432/testdb
        -user=postgres -password=pw migrate
  after_script:
    - docker rm -f $PG_CONTAINER 2>/dev/null || true
    - docker network rm $NET_NAME 2>/dev/null || true
  rules:
    - changes:
        - backend/src/main/resources/db/migration/**/*

# ─── Deploy ──────────────────────────────────────────────────────────────────

deploy:
  stage: deploy
  needs:
    - job: build-backend
      optional: true
    - job: build-frontend
      optional: true
    - job: test-backend
      optional: true
  script:
    - docker rm -f postgres backend frontend 2>/dev/null || true
    - docker rm -f $(docker ps -q --filter "publish=8080") 2>/dev/null || true
    - docker rm -f $(docker ps -q --filter "publish=80") 2>/dev/null || true
    - docker compose --env-file /opt/projects/devstack/.env -f deploy/docker-compose.yml up -d --remove-orphans
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/**/*
        - frontend/**/*
        - deploy/**/*
