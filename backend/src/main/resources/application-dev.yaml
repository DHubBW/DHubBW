spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:h2:mem:testdb}
    driverClassName: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:password}

  output:
    ansi:
      enabled: always

  sql:
    init:
      mode: always
  flyway:
    enabled: false
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  mvc:
    dispatch-trace-request: true
  level:
    org.springframework.security: TRACE
logging:
  level:
    com.se.dhubbw: DEBUG
jwt:
  secret: ${JWT_SECRET:dev-secret-key-minimum-256-bits-required-for-hs256-algorithm-security}
  expiration: 86400000
  cookie:
    secure: false